<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine's Card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="heart">❤</div>
    <h1>Will you be my Valentine?</h1>
    <p>You're the sweetest part of my day.</p>

    <div class="buttons">
      <button id="yesBtn" class="btn yes">Yes</button>
      <button id="noBtn" class="btn no" type="button" aria-label="No, please don't click me">No</button>
    </div>

    <div id="message" class="message" hidden>
      <p>Yay! I knew it! 💖</p>
      <p>XD!! ; ).</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
