<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESUME</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="resume" space-live="aggressive">
    <h1>My Resume</h1>
    <p>This is a sample resume page.</p>

    <div class="buttons">
      <button id="downloadBtn" class="btn download">Download Resume</button>
      <button id="contactBtn" class="btn contact" type="button" aria-label="Contact me">Contact</button>
    </div>

    <div id="message" class="message" hidden>
      <p>Thank you for viewing my resume!</p>
      <p>Please feel free to reach out.</p>
    </div>
</body>
</html>
